id: "d2-mcp"
name: "D2-MCP"
version: "0.6.0-mlc"
status: "stable"
category: "Architecture & Design Tools"
license: "MIT"
platforms: [Windows, macOS, Linux]
slogan_en: "Turn architectural ideas into beautiful D2 diagrams instantly."
slogan_de: "Verwandeln Sie Architektur-Ideen sofort in ansprechende D2-Diagramme."

features:
  - icon: "layout"
    title_en: "Multiple Layout Engines"
    title_de: "Mehrere Layout-Engines"
    desc_en: "Support for Dagre, ELK, D2, and Tala layout engines for diverse visual styles."
    desc_de: "Unterstützung für Dagre, ELK, D2 und Tala Layout-Engines für vielfältige visuelle Stile."
  - icon: "code"
    title_en: "D2 Language Support"
    title_de: "D2-Sprachunterstützung"
    desc_en: "Full integration with the D2 declarative diagramming language."
    desc_de: "Vollständige Integration der deklarativen Diagrammsprache D2."
  - icon: "zap"
    title_en: "Rapid Prototyping"
    title_de: "Schnelles Prototyping"
    desc_en: "Go from text requirements to exported diagrams (SVG/PNG) in seconds."
    desc_de: "In Sekunden von Textanforderungen zu exportierten Diagrammen (SVG/PNG)."
  - icon: "share-2"
    title_en: "Multi-Transport Ready"
    title_de: "Multi-Transport-fähig"
    desc_en: "Works via Stdio, SSE, or Streamable HTTP for flexible deployment."
    desc_de: "Funktioniert über Stdio, SSE oder Streamable HTTP für flexiblen Einsatz."

downloads:
  free: true
  files:
    - os: "Windows"
      arch: "x64"
      label_en: "Windows AMD64"
      label_de: "Windows AMD64"
      file: "https://mlcgo.eu/downloads/d2-mcp/d2mcp-windows-amd64.exe"
    - os: "Linux"
      arch: "x86_64"
      label_en: "Linux AMD64"
      label_de: "Linux AMD64"
      file: "https://mlcgo.eu/downloads/d2-mcp/d2mcp-linux-amd64"
    - os: "macOS"
      arch: "Apple Silicon"
      label_en: "macOS (Apple Silicon)"
      label_de: "macOS (Apple Silicon)"
      file: "https://mlcgo.eu/downloads/d2-mcp/d2mcp-macos-arm64"
    - os: "macOS"
      arch: "Intel"
      label_en: "macOS (Intel)"
      label_de: "macOS (Intel)"
      file: "https://mlcgo.eu/downloads/d2-mcp/d2mcp-macos-amd64"
