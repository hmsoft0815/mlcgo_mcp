id: "openstreetmap-mcp"
name: "OpenStreetMap MCP"
version: "1.0.0"
status: "stable"
category: "Infrastructure"
license: "MIT"
platforms: [Windows, macOS, Linux]
slogan_en: "OpenStreetMap for your LLM — single Go binary, no Python, no Node.js required."
slogan_de: "OpenStreetMap für Ihr LLM — einzelne Go-Binary, kein Python, kein Node.js nötig."

screenshots:
  - "thumbnail.svg"

spotlight_sections:
  - title_en: "One Binary. Drop It. Done."
    title_de: "Eine Binary. Ablegen. Fertig."
    desc_en: "Most OSM MCP servers require Python or Node.js — with all the dependency hell that comes with it. This one is a single self-contained Go binary. Copy it, run it. No runtime, no pip install, no npm, no Docker."
    desc_de: "Die meisten OSM-MCP-Server erfordern Python oder Node.js — mit all dem Abhängigkeits-Chaos das damit einhergeht. Diese Binary ist selbst-enthaltend. Einfach kopieren, ausführen. Kein Runtime, kein pip install, kein npm, kein Docker."
    screenshot: "thumbnail.svg"
    items_en:
      - "No Python, no Node.js, no runtime dependencies"
      - "Single static binary for Windows, macOS, Linux"
      - "Works with Claude Desktop (stdio) and remote SSE out of the box"
    items_de:
      - "Kein Python, kein Node.js, keine Runtime-Abhängigkeiten"
      - "Einzelne statische Binary für Windows, macOS, Linux"
      - "Funktioniert mit Claude Desktop (stdio) und remote SSE sofort"

features:
  - icon: "package"
    title_en: "Single Binary — No Runtime"
    title_de: "Single Binary — kein Runtime"
    desc_en: "No Python, no Node.js. One file, runs everywhere. Unlike most OSM MCP servers."
    desc_de: "Kein Python, kein Node.js. Eine Datei, läuft überall. Anders als die meisten OSM-MCP-Server."
  - icon: "map-pin"
    title_en: "Geocoding & Reverse Geocoding"
    title_de: "Geokodierung"
    desc_en: "Convert addresses to coordinates and back using Nominatim."
    desc_de: "Adressen in Koordinaten umwandeln und umgekehrt — via Nominatim."
  - icon: "navigation"
    title_en: "Smart Routing"
    title_de: "Intelligentes Routing"
    desc_en: "Calculate routes for car, bicycle, or foot via OSRM."
    desc_de: "Routen für Auto, Fahrrad oder Fußgänger berechnen — via OSRM."
  - icon: "search"
    title_en: "Spatial POI Search"
    title_de: "Räumliche POI-Suche"
    desc_en: "Find schools, EV chargers, parking, and custom POIs via the Overpass API."
    desc_de: "Schulen, E-Ladestationen, Parkplätze und beliebige POIs via Overpass API."
  - icon: "plug"
    title_en: "stdio + SSE Transport"
    title_de: "stdio + SSE Transport"
    desc_en: "Works locally with Claude Desktop (stdio) and remotely over SSE."
    desc_de: "Lokal mit Claude Desktop (stdio) und remote über SSE einsetzbar."
  - icon: "shield-check"
    title_en: "Fair Use Built-in"
    title_de: "Fair Use integriert"
    desc_en: "Configurable rate limiting to respect OpenStreetMap usage policies."
    desc_de: "Konfigurierbares Rate-Limiting zur Einhaltung der OSM Fair-Use-Richtlinien."

downloads:
  free: true
  notices:
    - type: warning
      en: "Uses public OpenStreetMap APIs (Nominatim, OSRM, Overpass). Please review the OSM fair usage policy before deploying in production."
      de: "Nutzt öffentliche OpenStreetMap APIs (Nominatim, OSRM, Overpass). Bitte die OSM Fair-Use-Richtlinien vor dem Produktiveinsatz prüfen."
  files:
    - os: "Windows"
      arch: "x64"
      label_en: "Windows AMD64"
      label_de: "Windows AMD64"
      file: "https://mlcgo.eu/downloads/openstreetmap-mcp/osm-mcp-windows-amd64.exe"
    - os: "Linux"
      arch: "x86_64"
      label_en: "Linux AMD64"
      label_de: "Linux AMD64"
      file: "https://mlcgo.eu/downloads/openstreetmap-mcp/osm-mcp-linux-amd64"
    - os: "macOS"
      arch: "Apple Silicon"
      label_en: "macOS (Apple Silicon)"
      label_de: "macOS (Apple Silicon)"
      file: "https://mlcgo.eu/downloads/openstreetmap-mcp/osm-mcp-macos-arm64"
    - os: "macOS"
      arch: "Intel"
      label_en: "macOS (Intel)"
      label_de: "macOS (Intel)"
      file: "https://mlcgo.eu/downloads/openstreetmap-mcp/osm-mcp-macos-amd64"
